# =============================================================================
# boards/openocd/f103rb.cfg —— NUCLEO-F103RB（板载 ST-Link/V2-1）
#
# 被 boards/f103rb.mk 引用，最终由 mk/arm-clang.mk 的 flash / probe / openocd
# 目标使用：
#     make flash     编程 + 校验 + 复位 + 退出
#     make probe     halt 后只读回读（不动 Flash）
#     make openocd   前台常驻，开出 :3333
#
# 手工调用时要给 -s（scripts 搜索根）：
#     openocd -s <openocd>/scripts -f boards/openocd/f103rb.cfg
# 不给 -s 会报 "Can't find interface/…"，因为这份文件里的 find 是相对搜索根找的。
# xpack 发行版的 scripts 目录可用 `tools/env.sh` 查出来。
# =============================================================================

# --- 1. 调试器 -----------------------------------------------------------------
# 板卡脚本内部已经 source 了 interface/stlink-v2-1.cfg（NUCLEO 板载的 ST-Link/V2-1，走 SWD，占 PA13/PA14）。
source [find board/st_nucleo_f103rb.cfg]

# --- 2. 目标芯片 ---------------------------------------------------------------
# 板卡脚本内部已经 source 了 target/stm32f1x.cfg，等价于：
#   set _CHIPNAME stm32f1x
#   set _CPUTAPID 0x1ba01477
#   swd newdap ...
#   cortex_m newtap $_CHIPNAME cpu     ← Cortex-M3，无 FPU
#
# 如果是「裸 F103 核心板 + 外接 USB 转 SWD 的 ST-Link」，不要用板卡脚本，
# 用 boards/openocd/generic-stlink-f103.cfg（等价但更通用）。

# --- 3. 复位方式 ---------------------------------------------------------------
# srst_only   只拉 NRST，不复位调试器本身
# srst_nogate 允许 CPU 已 halt 时也执行 srst（否则 gdb 里 reset 会失败）
# 只做软件复位的话，SWD 时钟可能跟着乱，导致连接断开。
reset_config srst_only srst_nogate

# --- 4. 适配速度 ---------------------------------------------------------------
# ST-Link 默认 1MHz 左右；长排线或自制板可以降到 500kHz 先求能连上。
# 实测会看到 "Unable to match requested speed 1000 kHz, using 950 kHz" —— 那是 Info，不是错误。
# adapter speed 1000

# --- 5. Flash 参数 -------------------------------------------------------------
# target/stm32f1x.cfg 已声明：
#   flash bank $_FLASHNAME stm32f1x 0x08000000 0 0 0 $_TARGETNAME
# 列出来是提醒：0x08000000 与 linker.ld 里的 ORIGIN、与 boards/f103rb.mk 的
# BOARD_FLASH_ORIGIN 是同一个数，三处必须一致。
