# =============================================================================
# boards/openocd/generic-stlink-f103.cfg —— 外接 ST-Link + 裸 F103 板（非 Nucleo）
#
# 被 boards/f103c8t6.mk 引用。与 f103rb.cfg 的区别：不走「板卡脚本」
# （board/st_nucleo_f103rb.cfg 绑定了 Nucleo 的板载调试器），
# 而是分别指定「调试器」和「目标芯片」两件事。
#
#     make BOARD=f103c8t6 flash
# =============================================================================

# 调试器：克隆版 ST-Link 大多是 V2（也有标 V2-1 的，SWD 时序基本一致）
source [find interface/stlink-v2.cfg]

# 目标：整个 STM32F1 系列的 SWD tap + Cortex-M3 内核
source [find target/stm32f1x.cfg]

# 复位：只用 NRST。BOOT0/BOOT1 决定从哪里启动，OpenOCD 复位不会改这两个引脚，
# 所以 BOOT0 必须已经在 0（从 Flash 启动），否则烧完不会跑你刚烧的程序。
reset_config srst_only srst_nogate

# 连接不稳时逐级降速排查
# adapter speed 500
