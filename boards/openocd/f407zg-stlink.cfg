# =============================================================================
# boards/openocd/f407zg-stlink.cfg —— 外接 ST-Link + STM32F407（含正点原子探索者）
#
# 被 boards/f407zg.mk 引用。
#     make BOARD=f407zg flash
#
# 与 F103 配置的两处不同：
#   1. target 换 stm32f4x.cfg（Cortex-M4F，1MB Flash，扇区大小不是 1K 而是不等（16K/64K/128K））
#   2. 探索者板上没有板载调试器，调试器要从 SWD 排针外接
# =============================================================================

# 调试器：
#   官方 ST-Link/V2 及 V2-1 用 interface/stlink.cfg
#   克隆版（多数"ST-Link V2"小蓝棒）用 interface/stlink-v2.cfg
# 两者二选一，连不上时先换另一份试。
source [find interface/stlink.cfg]

# 目标：STM32F4 系列的 SWD tap + Cortex-M4F 内核
source [find target/stm32f4x.cfg]

reset_config srst_only srst_nogate

# F407 跑 168MHz 时 SWD 也更快，长排线不稳就降速
# adapter speed 1000
